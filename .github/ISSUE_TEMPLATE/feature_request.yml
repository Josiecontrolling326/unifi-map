name: Feature request
description: Suggest something this should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        `CLAUDE.md` has an "Open work" section listing what is already planned,
        including manual overrides, an infrastructure view and ISP logos. Worth a
        look first, though a nudge on something already listed is still useful
        signal.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem, rather than the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you think would solve it
